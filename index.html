<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeTracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%234a6cd8'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23000'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="text" class="text-overlay" hidden></div>

    <div id="debug" class="debug" hidden></div>

    <div id="panel" class="panel" hidden>
      <h1>EyeTracker</h1>

      <label>
        Source
        <select id="source-type">
          <option value="webcam">Webcam</option>
          <option value="file">Video file</option>
          <option value="url">Stream URL</option>
        </select>
      </label>

      <label id="row-device">
        Camera
        <select id="source-device"></select>
      </label>

      <label id="row-file" hidden>
        File
        <input id="source-file" type="file" accept="video/*" />
      </label>

      <label id="row-url" hidden>
        URL
        <input id="source-url" type="url" placeholder="https://host/video.mp4, .m3u8 or WHEP endpoint" />
      </label>

      <div class="panel-actions">
        <button id="source-apply" type="button">Start</button>
      </div>

      <p class="panel-status" id="panel-status"></p>

      <p class="panel-help">
        <kbd>S</kbd> settings &middot;
        <kbd>D</kbd> debug view &middot;
        <kbd>F</kbd> fullscreen &middot;
        <kbd>&rarr;</kbd> next background
      </p>
    </div>

    <div id="loading" class="loading">Loading&hellip;</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
