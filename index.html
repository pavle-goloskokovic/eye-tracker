<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeTracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%234a6cd8'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23000'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />

    <!--
      Preload hints: without these the browser only discovers the
      model, textures and detector runtime after the JS bundle has
      loaded and run. The crossorigin attribute must match how each
      file is later requested (fetch / Three's ImageLoader), or the
      preload is wasted and the file downloads twice.
    -->
    <link rel="preload" href="/config.json" as="fetch" crossorigin />
    <link rel="preload" href="/assets/eye.glb" as="fetch" crossorigin />
    <link rel="preload" href="/assets/eye_basecolor.webp" as="image" crossorigin />
    <link rel="preload" href="/assets/eye_normal.webp" as="image" crossorigin />
    <link rel="preload" href="/assets/fonts/pixel.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/models/blaze_face_short_range.tflite" as="fetch" crossorigin />
    <link
      rel="preload"
      href="/mediapipe/wasm/vision_wasm_internal.wasm"
      as="fetch"
      crossorigin
      fetchpriority="low"
    />
  </head>
  <body>
    <div id="app"></div>

    <div id="text" class="text-overlay" hidden></div>

    <div id="debug" class="debug" hidden></div>

    <div id="panel" class="panel" hidden>
      <h1>EyeTracker</h1>

      <label>
        Source
        <select id="source-type">
          <option value="webcam">Webcam</option>
          <option value="file">Video file</option>
          <option value="url">Stream URL</option>
        </select>
      </label>

      <label id="row-device">
        Camera
        <select id="source-device"></select>
      </label>

      <label id="row-file" hidden>
        File
        <input id="source-file" type="file" accept="video/*" />
      </label>

      <label id="row-url" hidden>
        URL
        <input id="source-url" type="url" placeholder="https://host/video.mp4, .m3u8 or WHEP endpoint" />
      </label>

      <div class="panel-actions">
        <button id="source-apply" type="button">Start</button>
      </div>

      <p class="panel-status" id="panel-status"></p>

      <p class="panel-help">
        <kbd>S</kbd> settings &middot;
        <kbd>D</kbd> debug view &middot;
        <kbd>F</kbd> fullscreen &middot;
        <kbd>&rarr;</kbd> next background
      </p>
    </div>

    <div id="loading" class="loading">
      <div id="loading-text" class="loading-text">Loading&hellip;</div>
      <div class="loading-track"><div id="loading-bar" class="loading-bar"></div></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
